<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Lost &amp; Found Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F2; --surface: #fff; --accent: #356959;
      --text: #333730; --muted: #6B7280; --border: #E5E4E0;
      --radius: 14px; --shadow: 0 2px 14px rgba(0,0,0,0.07);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; padding: 0 25px; display: flex; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .school-logo { width: 38px; height: 38px; object-fit: contain; }
    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); width: 100%; max-width: 400px; padding: 2.5rem 2rem; box-shadow: var(--shadow); }
    .login-card h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; text-align: center; }
    .form-row { margin-bottom: 1.25rem; }
    .form-row label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; }
    .form-row input { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: 9px; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--text); background: var(--bg); outline: none; transition: border 0.18s; }
    .form-row input:focus { border-color: var(--accent); background: white; }
    .error-msg { background: #FEE2E2; color: #cc4646; font-size: 0.85rem; padding: 0.65rem 0.9rem; border-radius: 9px; margin-bottom: 1.25rem; font-weight: 500; }
    .btn { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 0.65rem 1.1rem; border-radius: 8px; border: none; cursor: pointer; width: 100%; transition: all 0.18s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #467a69; transform: translateY(-1px); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="School Logo" class="school-logo">
      <span>Lost &amp; Found Hub</span>
    </a>
  </nav>
  <div class="login-wrap">
    <div class="login-card">
      <h2>Admin Login</h2>
      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
      <form method="POST" action="{{ url_for('admin_login') }}">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Admin username" required autofocus />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Admin password" required />
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
